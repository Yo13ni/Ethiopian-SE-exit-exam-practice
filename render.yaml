# Render Blueprint — auto-deploy on every push to main
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: exit-exam-practice
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python server/server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
