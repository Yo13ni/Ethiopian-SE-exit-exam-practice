# Render Blueprint — auto-deploy on every push to main
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: exit-exam-practice
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Optional: enable server-side AI without users entering a key in Settings
      # - key: OPENAI_API_KEY
      #   sync: false
